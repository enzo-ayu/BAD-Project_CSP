{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Chona's Skincare Place</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-image: url('{% static "images/Login_BG.png" %}');
            background-color: #f4f7f6;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 2.5rem;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        .brand-title {
            color: #CE548D;
            font-weight: bold;
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .btn-custom {
            background-color: #CE548D;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px;
            font-weight: 500;
        }
        .btn-custom:hover {
            background-color: #b04375;
            color: white;
        }
        .form-control:focus {
            border-color: #CE548D;
            box-shadow: 0 0 0 0.2rem rgba(206, 84, 141, 0.25);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h3 class="brand-title">Chona's Skincare Place</h3>
        <p class="text-center text-muted mb-4">Please log in to continue</p>

        <form method="POST">
            {% csrf_token %}
            
            <div class="mb-3">
                {{ form.username.label_tag }}
                <input type="text" name="{{ form.username.html_name }}" class="form-control" required id="{{ form.username.id_for_label }}">
            </div>

            <div class="mb-3">
                {{ form.password.label_tag }}
                <input type="password" name="{{ form.password.html_name }}" class="form-control" required id="{{ form.password.id_for_label }}">
            </div>

            {% if form.errors %}
                <div class="alert alert-danger p-2" role="alert">
                    Invalid username or password.
                </div>
            {% endif %}

            <button type="submit" class="btn btn-custom w-100 mt-2">Log In</button>
        </form>

    </div>

</body>
</html>
