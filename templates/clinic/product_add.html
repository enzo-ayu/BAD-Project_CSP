{% extends 'clinic/base.html' %}
{% block content %}

<div class="container bg-light p-4 rounded shadow-sm" style="max-width: 700px;">

    {% if messages %}
    <div class="mb-3">
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <div class="mb-3">
        <a href="{% url 'inventory' %}" class="text-decoration-none text-muted small">← Back to Inventory</a>
        <h4 class="fw-bold mt-2" style="color: #CE548D;">Add New Product</h4>
    </div>

    <form method="POST" id="addProductForm">
        {% csrf_token %}

        <div class="mb-3">
            <label class="small fw-bold text-secondary">Product Name <span class="text-danger">*</span></label>
            <input type="text" name="product_name"
                   value="{{ form_data.product_name }}"
                   class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="small fw-bold text-secondary">Product Type <span class="text-danger">*</span></label>
            <input type="text" name="product_type"
                   value="{{ form_data.product_type }}"
                   class="form-control"
                   placeholder="e.g. Cream, Toner, Serum" required>
        </div>

        <div class="mb-3">
            <label class="small fw-bold text-secondary">Description</label>
            <textarea name="description" class="form-control" rows="2">{{ form_data.description }}</textarea>
        </div>

        <div class="mb-3">
            <label class="small fw-bold text-secondary">Unit Cost (₱) <span class="text-danger">*</span></label>
            <input type="number" name="unit_cost"
                   value="{{ form_data.unit_cost }}"
                   class="form-control"
                   step="0.01" min="0" required>
        </div>

        <div class="mb-3">
            <label class="small fw-bold text-secondary">Supplier <span class="text-danger">*</span></label>
            <select name="supplier" class="form-select" required>
                <option value="" disabled {% if not form_data.supplier %}selected{% endif %}>
                    Select Supplier
                </option>
                {% for s in suppliers %}
                <option value="{{ s.supplier_id }}"
                        {% if form_data.supplier == s.supplier_id|stringformat:"s" %}selected{% endif %}>
                    {{ s.supplier_name }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="d-flex justify-content-between mt-4">
            <a href="{% url 'product_add' %}" class="btn btn-outline-secondary px-4">Clear Form</a>
            <button type="submit" class="btn global-confirm-btn px-4">Add Product</button>
        </div>

    </form>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Initialize the Global Helper from base.html
    setupGlobalConfirmation(
        'addProductForm', 
        'Confirm New Product', 
        'Are you sure you want to add this product to the inventory?'
    );
});
</script>

{% endblock %}
