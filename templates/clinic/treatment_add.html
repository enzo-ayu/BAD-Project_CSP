{% extends 'clinic/base.html' %}
{% block content %}

<div class="page-container">

    <a href="{% url 'producttreatment_db' %}?{{ query_string }}" class="back-btn">← Back</a>

    <div class="card">
        <h2 class="page-title">Add Treatment Record</h2>

        <form method="POST">
            {% csrf_token %}

            <div class="form-grid">

                <div class="form-group full">
                    <label>Treatment Type</label>
                    <input type="text" name="treatment_type">
                </div>

                <div class="form-group">
                    <label>Treatment Name</label>
                    <input type="text" name="treatment_name">
                </div>

                <div class="form-group">
                    <label>Treatment Cost</label>
                    <input type="number" step="0.01" name="treatment_cost" min="100.00">
                </div>

                <div class="form-group">
                    <label>Branch</label>
                    <select name="branch">
                        {% for b in branches %}
                        <option value="{{ b.branch_id }}">{{ b.branch_location }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label>Availability</label><br>
                    <input type="checkbox" name="availability_status">
                </div>

                <div class="form-group full">
                    <label>Description</label>
                    <textarea name="description"></textarea>
                </div>

            </div>

            <div class="actions">
                <a href="{% url 'producttreatment_db' %}" class="btn cancel">Cancel</a>
                <button type="submit" class="btn save">Save Changes</button>
            </div>

        </form>
    </div>
</div>

<style>
.card {
    background: #ffffff;
    border-radius: 12px;
    padding: 30px;
    width: 100%;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

.page-title {
    color: #c94f7c;
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 20px;
}

.back-btn {
    margin-bottom: 15px;
    display: inline-block;
    color: #777;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.form-group.full {
    grid-column: span 2;
}

input, select, textarea {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    background: #f5f5f5;
    border: 1px solid #ddd;
}

textarea {
    min-height: 120px;
}

.actions {
    display: flex;
    justify-content: flex-end;
    margin-top: 20px;
    gap: 10px;
}

.btn.save {
    background: #c94f7c;
    color: white;
}

.btn.cancel {
    border: 1px solid #e57373;
    color: #e57373;
    background: transparent;
}

</style>

{% endblock %}
